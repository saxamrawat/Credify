[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "propensity_prediction"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.7,<3.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "streamlit>=1.40,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
